name: Publish verified preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: foxway-preview-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: v0.3.0-preview.1
      SOURCE_SHA: ad803c7d9bc8df3a1904cc3cef8e3b45e2efcede
    steps:
      - uses: actions/checkout@v4
      - name: Verify source CI succeeded
        run: |
          gh api repos/${{ github.repository }}/actions/runs/42800991614 > run.json
          python3 -c 'import json,os; r=json.load(open("run.json")); assert r["conclusion"] == "success" and r["head_sha"] == os.environ["SOURCE_SHA"]'
      - name: Verify publication commit contains the identical tested application
        run: |
          gh api repos/${{ github.repository }}/compare/$SOURCE_SHA...$GITHUB_SHA > publication-diff.json
          python3 -c 'import json; r=json.load(open("publication-diff.json")); allowed={"README.md","docs/RELEASE_NOTES.md","docs/VALIDATION.md",".github/workflows/release.yml"}; assert r["status"] in ("ahead","identical") and all(f["filename"] in allowed for f in r["files"]), "Application differs from verified build"'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42800991614
          path: release-input
      - run: python3 scripts/package_release.py
      - name: Publish prerelease
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files"
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --prerelease --title "FoxWay VPN 0.3.0 — updates and session protection preview" --notes-file docs/RELEASE_NOTES.md release-output/*
