name: FoxWay checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foxway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python3 -m unittest discover -s backend -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            build/review/
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: sdkmanager "cmake;3.22.1"
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Android-preview-test-key
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            path: build/windows/x64/runner/Release/
          - os: macos-14
            target: macos
            path: build/macos/Build/Products/Release/
          - os: ubuntu-24.04
            target: linux
            path: build/linux/x64/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libssl-dev
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-UI-preview-no-VPN
          path: ${{ matrix.path }}
  ios:
    needs: checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-unsigned-UI-preview-no-VPN
          path: build/ios/iphoneos/Runner.app
