name: FoxWay checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foxway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Validate configurations with the official native core
        run: |
          python3 scripts/install_desktop_core.py build/native
          build/native/sing-box check -c build/review/sing-desktop.json
          build/native/sing-box check -c build/review/sing-ios.json
          python3 scripts/native_route_smoke.py build/native/sing-box build/review/sing-desktop.json
          python3 scripts/native_route_smoke.py build/native/sing-box build/review/sing-ios.json
      - run: python3 -m unittest discover -s backend -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            build/review/
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "cmake;3.22.1"
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Android-preview-test-key
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            path: build/windows/x64/runner/Release/
          - os: macos-15
            target: macos
            path: build/macos/Build/Products/Release/
          - os: ubuntu-24.04
            target: linux
            path: build/linux/x64/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libssl-dev
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            native/windows-awg/go.sum
            native/awg-cli/go.sum
            native/amnezia-apple/Sources/WireGuardKitGo/go.sum
      - name: Build AmneziaWG macOS bridge
        if: matrix.target == 'macos'
        run: make -C native/amnezia-apple/Sources/WireGuardKitGo PLATFORM_NAME=macosx ARCHS="arm64 x86_64" SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" DESTDIR="$PWD/native/amnezia-apple/Sources/WireGuardKitGo/out" DEPLOYMENT_TARGET_CLANG_FLAG_NAME=mmacosx-version-min DEPLOYMENT_TARGET_CLANG_ENV_NAME=MACOSX_DEPLOYMENT_TARGET MACOSX_DEPLOYMENT_TARGET=12.0
      - run: flutter build ${{ matrix.target }} --release
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/config/unsigned-macos.xcconfig
      - name: Bundle AmneziaWG Linux engine
        if: matrix.target == 'linux'
        shell: bash
        run: |
          (cd native/awg-cli && go build -mod=readonly -trimpath -o ../../${{ matrix.path }}/amneziawg-go github.com/amnezia-vpn/amneziawg-go/v3)
          make -C native/amnezia-tools/src
          cp native/amnezia-tools/src/wg "${{ matrix.path }}/awg"
          cp native/amnezia-tools/src/wg-quick/linux.bash "${{ matrix.path }}/awg-quick"
          chmod 755 "${{ matrix.path }}/awg-quick"
          cp native/amnezia-tools/COPYING "${{ matrix.path }}/AMNEZIA-TOOLS-LICENSE.txt"
      - name: Bundle AmneziaWG Windows engine
        if: matrix.target == 'windows'
        shell: bash
        run: |
          (cd native/windows-awg && go build -mod=readonly -trimpath -o ../../${{ matrix.path }}/foxway-awg.exe .)
          python scripts/install_wintun.py "${{ matrix.path }}"

      - name: Bundle verified native TUN core
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            python3 scripts/install_desktop_core.py "build/macos/Build/Products/Release/FoxWay VPN.app/Contents/MacOS" arm64
            python3 scripts/install_desktop_core.py "build/macos/Build/Products/Release/FoxWay VPN.app/Contents/MacOS" amd64
            codesign --force --deep --sign - "build/macos/Build/Products/Release/FoxWay VPN.app"
          else
            python3 scripts/install_desktop_core.py "${{ matrix.path }}"
          fi
      - name: Preserve Apple bundle symlinks and executable permissions
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/FoxWay VPN.app" build/FoxWay-macos-unsigned-AWG-VLESS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-AWG-VLESS-experimental
          path: ${{ matrix.target == 'macos' && 'build/FoxWay-macos-unsigned-AWG-VLESS.zip' || matrix.path }}
  ios:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: native/amnezia-apple/Sources/WireGuardKitGo/go.sum
      - name: Build official AmneziaWG Apple bridge
        run: |
          make -C native/amnezia-apple/Sources/WireGuardKitGo PLATFORM_NAME=iphoneos ARCHS=arm64 SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" DESTDIR="$PWD/native/amnezia-apple/Sources/WireGuardKitGo/out" DEPLOYMENT_TARGET_CLANG_FLAG_NAME=miphoneos-version-min DEPLOYMENT_TARGET_CLANG_ENV_NAME=IPHONEOS_DEPLOYMENT_TARGET IPHONEOS_DEPLOYMENT_TARGET=15.0
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/FoxWay-iOS-unsigned-AWG-VLESS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-unsigned-AWG-VLESS-experimental
          path: build/FoxWay-iOS-unsigned-AWG-VLESS.zip

  sources:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: python3 scripts/bundle_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          compression-level: 0
          path: build/FoxWay-corresponding-source.tar.gz
